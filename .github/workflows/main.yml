name: Update PGA data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the PGA archive
        run: git clone https://github.com/OpenTermsArchive/genai-eu-versions.git /tmp/pga
      - name: Run the update script
        run: python3 update.py /tmp/pga
      - name: Save the result
        run: |
          git config user.name "ip06-bot"
          git config user.email "ip06-bot@users.noreply.github.com"
          git add data/versions.json
          git diff --cached --quiet || git commit -m "Update PGA data"
          git push
